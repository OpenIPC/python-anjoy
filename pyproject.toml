[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-anjoy"
version = "0.1.0"
description = "Pure-stdlib client for stock Anjoy (安佳威视) IP cameras"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenIPC" }]
keywords = ["anjoy", "anjvision", "sigmastar", "ip-camera", "cctv", "ptz", "rtsp", "onvif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/OpenIPC/python-anjoy"
Source = "https://github.com/OpenIPC/python-anjoy"
Issues = "https://github.com/OpenIPC/python-anjoy/issues"

[project.scripts]
anjoy = "anjoy.cli:main"

[tool.setuptools]
packages = ["anjoy"]
